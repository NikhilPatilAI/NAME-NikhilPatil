<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Let's build something that survives contact with production. Nikhil Patil, Mumbai, India.">
  <title>Let's build something that survives contact with production.</title>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0F141B"/>
      <stop offset="55%"  stop-color="#0C1016"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="46%" r="46%">
      <stop offset="0%"   stop-color="#E9C46A" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="6%" cy="88%" r="42%">
      <stop offset="0%"   stop-color="#E76F51" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#E76F51" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="260" rx="18"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif; }
      .mono  { font-family: 'JetBrains Mono','SF Mono','Cascadia Mono','Roboto Mono',Consolas,monospace; }
      .r { opacity: 0; animation: fu .9s cubic-bezier(.16,.84,.28,1) forwards; }
      @keyframes fu { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
      .dot { animation: blink 2.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.28 } }
      .rule { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.4s cubic-bezier(.2,.8,.2,1) .5s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#card)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect width="1200" height="260" fill="url(#glow2)"/>
    <rect width="1200" height="260" filter="url(#grain)" opacity=".055"/>
    <g stroke="#E9C46A" stroke-opacity=".26" stroke-width="1">
      <path d="M28 44 v-16 h16"/>
      <path d="M1172 44 v-16 h-16"/>
      <path d="M28 216 v16 h16"/>
      <path d="M1172 216 v16 h-16"/>
    </g>

    <text class="serif r" x="600" y="108" text-anchor="middle" font-size="46" letter-spacing="1" fill="#F2F5F8" style="animation-delay:0.10s">Let’s build something that</text>
    <text class="serif r" x="600" y="164" text-anchor="middle" font-size="46" font-style="italic" letter-spacing="1" fill="#E9C46A" style="animation-delay:0.26s">survives contact with production.</text>
    <line class="rule" x1="500" y1="198" x2="700" y2="198" stroke="#E9C46A" stroke-opacity=".42" stroke-width="1"/>
    <text class="mono r" x="600" y="230" text-anchor="middle" font-size="14" letter-spacing="4" fill="#5C6570" style="animation-delay:0.50s">NIKHIL PATIL · MUMBAI, INDIA · IST UTC+05:30</text>

    <rect x=".5" y=".5" width="1199" height="259" rx="18" fill="none" stroke="#E9C46A" stroke-opacity=".14"/>
  </g>
</svg>
