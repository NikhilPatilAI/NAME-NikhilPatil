<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="AI But Simple. A 28 episode Hinglish podcast by Nikhil Patil that rebuilds one AI idea per episode from first principles, for Indian CS students. Play on YouTube.">
  <title>AI But Simple · podcast</title>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0F141B"/>
      <stop offset="55%"  stop-color="#0C1016"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="46%" r="46%">
      <stop offset="0%"   stop-color="#E9C46A" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="6%" cy="88%" r="42%">
      <stop offset="0%"   stop-color="#E76F51" stop-opacity=".09"/>
